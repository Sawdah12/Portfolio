        function createParticles() {
            const container = document.getElementById('particles-js');
            for(let i=0;i<50;i++){

                p.className='particle';
                p.style.left=Math.random()*100+'%';
                p.style.top=Math.random()*100+'%';
                const size=Math.random()*4+2;
                p.style.width=size+'px';
                p.style.height=size+'px';
                p.style.animationDelay=Math.random()*6+'s';
                p.style.animationDuration=(Math.random()*3+3)+'s';
                container.appendChild(p);

            initTypewriter() {
    const el = document.getElementById('typewriter');
    const texts = ['Graphic Designer'];
    let currentTextIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function type() {
        const currentText = texts[currentTextIndex];

        if (!deleting) {
            // Add character
            el.textContent = currentText.slice(0, charIndex + 1);
            charIndex++;

            if (charIndex === currentText.length) {
                // Wait before starting to delete
                deleting = true;
                setTimeout(type, 1500);
                return;
            }
        } else {
            // Remove character
            el.textContent = currentText.slice(0, charIndex - 1);
            charIndex--;

            if (charIndex === 0) {
                // Move to next text
                deleting = false;
                currentTextIndex = (currentTextIndex + 1) % texts.length;
                setTimeout(type, 500);
                return;
            }
        }

        setTimeout(type, deleting ? 50 : 100);
    }

    // Start typing after initial delay
    setTimeout(type, 1000);
}

        // INITIALIZE PARTICLES AND ANIMATION
        document.addEventListener('DOMContentLoaded', ()=>{
            createParticles();

            const observer = new IntersectionObserver((entries)=>{
                entries.forEach(entry=>{
                    if(entry.isIntersecting && !entry.target.classList.contains('animate__animated')) {
                        entry.target.classList.add('animate__animated','animate__fadeInUp');
                        observer.unobserve(entry.target); // run animation only once per section
                    }
                });
            },{threshold:0.1,rootMargin:'0px 0px -50px 0px'});

            document.querySelectorAll('section').forEach(s=>observer.observe(s));
        });
